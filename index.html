<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>∞ INFINITY</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --navy:#0b1220; --line:#dbe3ee; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { display:grid; grid-template-rows:54px minmax(0,1fr) 98px 204px; background:#eef2f7; }
    #navigation { position:relative; z-index:5; width:100%; height:54px; border:0; display:block; background:#0b1220; }
    #workspace { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 10px minmax(280px,36%); gap:0; padding:10px; }
    .workspace-frame { border:1px solid var(--line); border-radius:12px; background:#fff; min-width:0; min-height:0; width:100%; height:100%; }
    #editor-frame { display:block; }
    #settings-frame { display:none; }
    #help-frame { display:none; }
    #preview-frame { display:block; }
    #workspace-divider { position:relative; z-index:2; cursor:col-resize; touch-action:none; }
    #workspace-divider::after { content:""; position:absolute; top:0; bottom:0; left:3px; width:4px; border-radius:4px; background:#cbd5e1; transition:background .15s; }
    #workspace-divider:hover::after, body.resizing #workspace-divider::after { background:#3b82f6; }
    #piano-frame { width:100%; height:204px; border:0; display:block; }
    #controls-frame { width:100%; height:98px; border:0; display:block; }
    #restore-preview { display:none; position:fixed; z-index:20; right:0; top:50%; transform:translateY(-50%); border:1px solid #cbd5e1; border-right:0; border-radius:10px 0 0 10px; padding:12px 10px; background:#0b1220; color:#fff; font:700 12px system-ui,sans-serif; writing-mode:vertical-rl; cursor:pointer; box-shadow:0 4px 14px #0b122033; }
    body.preview-collapsed #workspace { grid-template-columns:minmax(0,1fr); }
    body.preview-collapsed #preview-frame, body.preview-collapsed #workspace-divider { display:none; }
    body.preview-collapsed #restore-preview { display:block; }
    body.no-preview #workspace { grid-template-columns:minmax(0,1fr); }
    body.no-preview #workspace-divider, body.no-preview #restore-preview { display:none; }
    body.settings-mode #editor-frame, body.settings-mode #preview-frame { display:none; }
    body.settings-mode #settings-frame { display:block; grid-column:1 / -1; }
    body.help-mode #editor-frame, body.help-mode #preview-frame, body.help-mode #settings-frame { display:none; }
    body.help-mode #help-frame { display:block; grid-column:1 / -1; }
    body.settings-mode #workspace-divider, body.settings-mode #restore-preview { display:none; }
    body.no-piano { grid-template-rows:54px minmax(0,1fr) 98px 0px; }
    @media (max-width:850px) {
      body { grid-template-rows:54px minmax(0,1fr) 112px 190px; }
      body.no-piano { grid-template-rows:54px minmax(0,1fr) 112px 0px; }
      #workspace { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(220px,1fr) 10px minmax(160px,.75fr); }
      #editor-frame { grid-row:1; }
      #workspace-divider { grid-row:2; cursor:row-resize; }
      #workspace-divider::after { top:3px; bottom:auto; left:0; right:0; width:auto; height:4px; }
      #preview-frame { grid-row:3; }
      body.preview-collapsed #workspace { grid-template-rows:minmax(0,1fr); }
      body.no-preview #workspace { grid-template-rows:minmax(0,1fr); }
      #piano-frame { height:190px; }
      #controls-frame { height:112px; }
    }
  </style>
</head>
<body>
  <iframe id="navigation" title="Main navigation" src="./Data/navigation.html"></iframe>
  <main id="workspace">
    <iframe id="editor-frame" class="workspace-frame" title="Music editor" src="./Data/index.html"></iframe>
    <div id="workspace-divider" role="separator" aria-label="Resize editor and score preview" aria-orientation="vertical" tabindex="0"></div>
    <iframe id="preview-frame" class="workspace-frame" title="Live score preview" src="./Data/preview.html"></iframe>
    <iframe id="settings-frame" class="workspace-frame" title="Settings" src="./Data/settings.html"></iframe>
    <iframe id="help-frame" class="workspace-frame" title="Help" src="./Data/help.html"></iframe>
  </main>
  <button id="restore-preview" type="button" aria-label="Show score preview" title="Show score preview">Show score</button>
  <iframe id="controls-frame" title="Music controls" src="./Data/controls.html"></iframe>
  <iframe id="piano-frame" title="Virtual piano" src="./Data/piano.html"></iframe>
  <script src="./Data/shell.js"></script>
</body>
</html>
