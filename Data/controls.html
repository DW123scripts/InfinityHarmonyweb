<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;height:100vh;background:#fff;border-top:1px solid #dbe3ee;color:#334155;font:600 12px Inter,system-ui,sans-serif;display:flex;align-items:center;gap:12px;padding:8px 14px;overflow:auto;scrollbar-width:thin}.row{display:flex;align-items:center;gap:6px;white-space:nowrap}.label{font-size:9px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em}.modes{display:flex;padding:3px;border-radius:9px;background:#e9eef5}.modes button,.duration button,.actions button{border:0;border-radius:7px;padding:8px 10px;background:transparent;color:inherit;font:inherit;cursor:pointer}.modes button.active{background:#2563eb;color:white;box-shadow:0 1px 4px #0002}.duration button,.actions button{background:#f1f5f9}.duration button.active{background:#2563eb;color:white}.actions button{font-weight:800}.actions .delete{background:#fee2e2;color:#b91c1c}.grow{flex:1;min-width:3px}.settings{display:flex;align-items:center;gap:7px}.settings select{border:1px solid #cbd5e1;border-radius:7px;background:white;color:inherit;padding:6px;font:inherit}.check{display:flex;align-items:center;gap:4px;font-size:11px}.dark{background:#0f172a;color:#e2e8f0;border-color:#334155}.dark .modes{background:#1e293b}.dark .duration button,.dark .actions button{background:#334155;color:#e2e8f0}.dark .actions .delete{background:#7f1d1d;color:#fecaca}.dark .settings select{background:#1e293b;color:#e2e8f0;border-color:#475569}.dark .duration button.active,.dark .modes button.active{background:#2563eb;color:white}
@media(max-width:950px){body{gap:8px;padding:6px 9px}.settings{flex-wrap:wrap}.modes button{padding:7px 8px}.duration button,.actions button{padding:7px 8px}}
</style></head><body>
<div class="row modes" aria-label="Note entry mode"><button data-mode="type">Type notes</button><button data-mode="numbers">Number keys</button><button data-mode="piano">Piano + keys</button></div>
<div class="row duration"><span class="label">Length</span><button data-duration="4">Whole</button><button data-duration="2">Half</button><button data-duration="1">¼</button><button data-duration=".5">⅛</button><button data-duration=".25">1/16</button><button id="dot">Dot</button></div>
<div class="row actions"><button class="delete" id="delete">⌫ Delete</button><button id="rest">Rest</button><button id="slur-open">(</button><button id="slur-close">)</button><button id="measure">+ Measure</button><button id="record">Sing</button><button id="play">▶ Play</button></div>
<span class="grow"></span><div class="row settings"><label class="check"><input id="preview" type="checkbox"> Score</label><label class="check">0 = <select id="zero"></select></label><label class="check">Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></div>
<script src="controls.js"></script></body></html>
